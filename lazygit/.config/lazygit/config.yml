# yaml-language-server: $schema=https://raw.githubusercontent.com/hareki/lazygit/master/schema-master/config.json
os:
  editPreset: 'nvim-remote'
  # The edit commands live in shell-functions.sh; the preset still decides when lazygit steps
  # aside for the editor: only outside nvim's terminal.
  shellFunctionsFile: '~/.config/lazygit/shell-functions.sh'
  edit: 'lazygit_edit {{filename}}'
  editAtLine: 'lazygit_edit +{{line}} {{filename}}'
  # Edit hunk waits for its editor to close, which a host nvim can't be asked for: a new nvim
  editAtLineAndWait: 'lazygit_nvim +{{line}} -- {{filename}}'
  openDirInEditor: 'lazygit_edit {{dir}}'

gui:
  fileTreeSortOrder: foldersFirst
  sidePanelWidth: 38
  screenMode: half
  mainPanelSplitMode: horizontal
  switchTabsWithPanelJumpKeys: true
  cursorStyle: 'blinkingBar'
  scrollHeight: 6
  scrollOffMargin: 6
  nerdFontsVersion: '3'
  spinner:
    frames:
      - "\U000F0130"
      - "\U000F0A9E"
      - "\U000F0A9F"
      - "\U000F0AA0"
      - "\U000F0AA2"
      - "\U000F0AA3"
      - "\U000F0AA4"
      - "\U000F0AA5"
  # https://github.com/catppuccin/lazygit
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    # selectedLineBgColor stays dark for text to read on it, which hides the two-column diff selection bar
    selectionBarBgColor:
      - '#5B5452'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
    authorColors:
      '*': '#b4befe'
git:
  diffRenderers:
    # Names on PATH rather than a path: see codediff/client.sh.
    - name: codediff
      colorArg: never
      command: lazygit-codediff
    - name: codediff-split
      colorArg: never
      command: lazygit-codediff-split
