default_channel = "dotfiles"

[ui]
ui_scale = 80
# Minimum inner size (in cells) of the centered UI popup; the bordered
# footprint adds 2 cells per axis. Matches the nvim `lg` popup preset.
min_width = 90
min_height = 15
merge_input_and_results = true
orientation = "portrait"
theme = "catppuccin-mocha"

[ui.input_bar]
prompt = "  "
border_type = "rounded"

[ui.status_bar]
hidden = true

[ui.results_panel]
border_type = "rounded"
header = ""

[ui.preview_panel]
header = ""
border_type = "rounded"
