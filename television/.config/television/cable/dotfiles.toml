[metadata]
name = "dotfiles"
description = "A channel to select dotfiles configs"
requirements = ["eza", "nvim"]

[ui]
layout = "landscape"
input_bar = { header = "Dotfiles" }

[source]
command = "cd $HOME/Repositories/personal/dotfiles && printf '%s\\n' */.config/*"
display = "{split:/:-1}"

[preview]
command = "cd $HOME/Repositories/personal/dotfiles/{split:/:0}/.config; eza --icons=always --color=always --no-user --tree {split:/:-1}"

[keybindings]
enter = "actions:edit"

[actions.edit]
description = "Open the config in Neovim"
command = "nvim $HOME/Repositories/personal/dotfiles/{}"
# Exiting television upon opening Neovim
mode = "execute"
