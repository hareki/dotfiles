# The scopes that differ from the built-in theme below. [metadata] has to stay last, since TOML
# puts every key after a table header into that table
"variable.other" = "#fab387"                  # Environment variables
"punctuation.definition.variable" = "#fab387" # Variable punctuation
"variable.language.tilde" = "#fab387"         # Home directory
"meta.group.expansion.history" = "#b4befe"
"dynamic.callable" = "#a6e3a1"

[metadata]
extends = "catppuccin-mocha"
