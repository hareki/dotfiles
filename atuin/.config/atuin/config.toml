style = "full"
invert = true
dialect = "uk"
show_help = false
show_tabs = false

inline_height = 15
max_width = 110

# Built from the hareki/atuin fork with `build atuin`, so a release check would only nag
update_check = false
show_numeric_shortcuts = false
theme.name = "catppuccin-mocha-blue"

keymap_mode = "emacs"
[keymap.emacs]
"ctrl-r" = "cursor-word-right"
"alt-f" = "cycle-filter-mode"
