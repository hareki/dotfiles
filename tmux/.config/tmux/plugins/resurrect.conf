# Pinned: scripts/resurrect-snapshots.zsh reads it from tmux, and falls back to
# this same path when no server is running
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

# Resurrect's own expiry (@resurrect-delete-backup-after) always keeps the 5 newest
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/scripts/resurrect-snapshots.zsh prune"

# Names a lone unnamed session 0, the only placeholder a restore from scratch replaces
set -g @resurrect-hook-pre-restore-all "$HOME/.config/tmux/scripts/resurrect-snapshots.zsh pre-restore"

# The mise shim execs nvim by its full path, which resurrect's default `nvim`
# entry never matches. Relaunched bare in the pane's directory (nvim's cwd at
# save time), auto-session reopens that directory's session
set -g @resurrect-processes '"~bin/nvim->nvim"'
