# Pinned: scripts/resurrect-snapshots.zsh reads it from tmux, and falls back to
# this same path when no server is running
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

# Expiry, as resurrect's own (@resurrect-delete-backup-after) always keeps the 5
# newest, and the command each pane running Claude Code is relaunched with
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/scripts/resurrect-snapshots.zsh post-save"

# Names a lone unnamed session 0, the only placeholder a restore from scratch replaces
set -g @resurrect-hook-pre-restore-all "$HOME/.config/tmux/scripts/resurrect-snapshots.zsh pre-restore"

# The mise shim execs nvim by its full path, which resurrect's default `nvim`
# entry never matches. Relaunched as `nvim .` in the pane's directory (nvim's
# cwd at save time), auto-session reopens that directory's session, or, when
# it has none (auto-session deletes an empty one), its no_restore hook opens
# nvim-tree the way `nvim .` does, where a bare `nvim` shows the intro screen.
# `claude` is the command the post-save hook gives a pane running Claude Code:
# `claude --resume <session id>`, typed as saved
set -g @resurrect-processes '"~bin/nvim->nvim ." claude'
