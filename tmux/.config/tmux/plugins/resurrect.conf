# Pinned: tsave and trestore read it from tmux, and `trestore --list` falls
# back to this same path when no server is running
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"

# Resurrect's own expiry (@resurrect-delete-backup-after) always keeps the 5 newest
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/scripts/resurrect-prune.sh"

# A restore from scratch (a lone pane) drops the placeholder session only when it's named 0,
# and this tmux build names unnamed sessions session-<id>. One line of output that reads 1 means
# exactly one pane, in an unnamed session
set -g @resurrect-hook-pre-restore-all '[ "$(tmux list-panes -a -F "#{m:session-[0-9]*,#{session_name}}")" = 1 ] && tmux rename-session 0'

# The mise shim execs nvim by its full path, which resurrect's default `nvim`
# entry never matches. Relaunched bare in the pane's directory (nvim's cwd at
# save time), auto-session reopens that directory's session
set -g @resurrect-processes '"~bin/nvim->nvim"'
