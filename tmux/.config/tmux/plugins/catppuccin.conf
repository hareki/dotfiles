set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_window_status_style 'rounded'

# tmux 3.8 defaults these to themed styles: "underscore" underlines the whole
# active pill, and menu items get a grey background
set -g window-status-current-style "default"
set -g menu-style "default"

# Not -F: these expand when drawn, after TPM has loaded the @thm_* palette.
# #4f5164 is shared with nvim's surface15 and zsh's region highlight
set -g menu-border-style "fg=#{@thm_blue}"
set -g copy-mode-selection-style "bg=#4f5164"
set -g copy-mode-match-style "fg=#{@thm_mantle},bg=#7ec9d8"
set -g copy-mode-current-match-style "fg=#{@thm_mantle},bg=#{@thm_red}"
set -g copy-mode-position-style "fg=#{@thm_blue},bg=#{@thm_bg}"

set -g @catppuccin_menu_selected_style "fg=#{@thm_fg},bg=#{@thm_surface_1}"
set -g @catppuccin_window_text " #[fg=#{@thm_subtext_0}]#{window_name}"
set -g @catppuccin_window_number_color "#{@thm_subtext_0}"

set -g @catppuccin_window_current_text " #[fg=#{@thm_blue}]#{window_name}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"

set -g @catppuccin_application_color "#{@thm_mauve}"
set -g @catppuccin_status_application_text_fg "#{@thm_mauve}"

set -g @catppuccin_status_session_text_fg "#{?client_prefix,#{@thm_red},#{@thm_green}}"

set -g @catppuccin_session_icon "󰙀 "
set -g @catppuccin_application_icon "󰲋 "

set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_right_separator ""

set -g @catppuccin_pane_active_border_style "##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_overlay_0}}"

source-file ~/.config/tmux/plugins/catppuccin-modules/*.conf

set -g status-left "#{E:@catppuccin_status_session} "
# The #{?} sits here, not in the module: commas in its #[] styles would split it
set -g status-right " #{?window_zoomed_flag,#{E:@catppuccin_status_zoom} ,}#{E:@catppuccin_status_application}"

# Window list overflow markers, options only the hareki/tmux build has
set -g status-list-left-marker "#[fg=#{@thm_yellow}]󰅁 "
set -g status-list-right-marker "#[fg=#{@thm_yellow}] 󰅂"
