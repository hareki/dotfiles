# vim-tmux-navigator's tmux half, bound here instead of loaded through TPM: the
# plugin's loader spends ~160ms of tmux calls on every server start and reload.
# Same `ps` check as the plugin, behind an in-process fast path that skips the
# spawn when the pane's foreground command is nvim itself
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?\$'"
%hidden vim_cmd='#{m/ri:^g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}'

bind -n M-m if -F "$vim_cmd" { send-keys M-m } { if-shell "$is_vim" { send-keys M-m } { select-pane -L } }
bind -n M-n if -F "$vim_cmd" { send-keys M-n } { if-shell "$is_vim" { send-keys M-n } { select-pane -D } }
bind -n M-e if -F "$vim_cmd" { send-keys M-e } { if-shell "$is_vim" { send-keys M-e } { select-pane -U } }
bind -n M-i if -F "$vim_cmd" { send-keys M-i } { if-shell "$is_vim" { send-keys M-i } { select-pane -R } }

bind -T copy-mode-vi M-m select-pane -L
bind -T copy-mode-vi M-n select-pane -D
bind -T copy-mode-vi M-e select-pane -U
bind -T copy-mode-vi M-i select-pane -R
