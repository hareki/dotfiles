# [[ Config reload ]]
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# [[ Splits, windows & sessions ]]
bind - split-window -v
bind \\ split-window -h
bind n new-window
bind N new-session
bind r command-prompt -I "#W" { rename-window -- "%%" }

# -d keeps focus on the moved window
bind -r Left  swap-window -d -t :-1
bind -r Right swap-window -d -t :+1

# cmd+[ / cmd+] => prev/next window, no prefix. See ghostty config
bind -n M-h previous-window
bind -n M-l next-window

# [[ Copy mode ]]
bind Escape copy-mode
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi a send -X cancel

bind -T copy-mode-vi PageUp   send -X halfpage-up   \; send -X scroll-middle
bind -T copy-mode-vi PageDown send -X halfpage-down \; send -X scroll-middle

# Make 'v' act like Vim's char-wise visual
bind -T copy-mode-vi v send -X begin-selection

# h yanks to the system clipboard (copy-command + OSC 52), k yanks and pastes
bind -T copy-mode-vi h send -X copy-pipe-and-cancel
bind -T copy-mode-vi k send -X copy-selection-and-cancel \; paste-buffer -p
