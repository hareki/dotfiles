# [[ General ]]
set -g prefix M-d
set -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# https://stackoverflow.com/questions/51343256/how-to-scroll-with-mouse-in-tmux-not-history-but-terminal-output
set -g mouse on

# Enables tracking of focus events, allows tmux to respond when the terminal
# window gains or loses focus
set -g focus-events on

# A server started from nvim's :terminal (trestore, mux, plain tmux) would hand
# $NVIM to every pane, where nvim then acts nested: auto-session skips its exit save
set-environment -gu NVIM

# [[ Windows & panes ]]
# Window name follows the running command (claude, nvim, zsh, ...).
# Exception: when Claude Code runs *directly* in a pane (pane_current_command == claude),
# use the live conversation title Claude publishes via OSC (#{pane_title}, e.g. "✳ <conversation title>").
# Claude run inside claudecode.nvim keeps pane_current_command == nvim, so those windows stay "nvim".
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{==:#{pane_current_command},claude},#{pane_title},#{pane_current_command}}#{?pane_dead,[dead]}"

set -g main-pane-width 50%
set -g main-pane-height 50%

# set -g pane-border-indicators both

# [[ Status bar ]]
set -g status-position top

# Expand length, otherwise it could get cut off
set -g status-right-length 100
set -g status-left-length 100

# [[ Terminal capabilities ]]
set -s set-clipboard on
set -s extended-keys on

# Fixed array indexes (instead of -a appends) so `prefix R` reloads stay
# idempotent; low indexes hold tmux's own defaults.
# Ss=\E[%p1%d q: Sets the cursor shape based on the cursor style parameter `%p1%d`, enabling dynamic cursor style changes
# Se=\E[ q: Resets the cursor to the terminal's default style
set -s terminal-overrides[8] '*:Ss=\E[%p1%d q:Se=\E[ q'

# Make tmux support true color and undercurl
# Claude Code 2.1.77+ has a hardcoded chalk.level=2 clamp inside $TMUX that runs
# even after FORCE_COLOR; this env var is the documented escape hatch.
# See https://github.com/anthropics/claude-code/issues/36785 and #46146.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
set -s terminal-features[8] 'xterm*:RGB:extkeys:usstyle' # true color, extended keys, undercurl

# [[ Image passthrough ]]
# https://github.com/folke/snacks.nvim/blob/main/docs/image.md
set -g allow-passthrough on

# [[ Cursor ]]
# Default style of tmux cursor style, this will affect something like lazygit
set -g cursor-style blinking-bar
set -g prompt-cursor-style blinking-bar

# [[ Copy mode ]]
# Every copy-pipe without its own command (the h yank, mouse drag, Enter) pipes
# here, on top of the OSC 52 copy that set-clipboard sends
set -s copy-command pbcopy
set -g copy-mode-position-format "#[align=right][#{scroll_position}/#{history_size}]"

# [[ Menus ]]
set -g menu-border-lines "rounded"
