# General configs
source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keymaps.conf

# Pin TPM's install path: with an XDG-located tmux.conf, TPM would otherwise
# default to ~/.config/tmux/plugins/, which is this (stowed) config directory.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Plugin configs
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'hareki/tmux-catppuccin'
source-file ~/.config/tmux/plugins/catppuccin.conf

set -g @plugin 'tmux-plugins/tmux-resurrect'
source-file ~/.config/tmux/plugins/resurrect.conf

source-file ~/.config/tmux/plugins/vim-tmux-navigator.conf

run '~/.tmux/plugins/tpm/tpm'
