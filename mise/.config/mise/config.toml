[tools]
node = "lts"
ruby = "latest"
rust = "latest"
go = "latest"
python = "latest"
bun = "latest"

# chromium-bidi has shipped without npm provenance since it moved into Chromium.
# This version matches a tsc rebuild of its Chromium tag; re-verify before bumping.
"npm:@mermaid-js/mermaid-cli" = { version = "latest", trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] }
"npm:@colbymchenry/codegraph" = "latest"
"npm:pretty-ts-errors-markdown" = "latest"
"npm:@styled/typescript-styled-plugin" = "latest"
"npm:typescript" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@astrojs/language-server" = "latest"
"npm:@t1ckbase/vscode-langservers-extracted" = "latest"
"npm:css-variables-language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:yaml-language-server" = "latest"
"npm:@ember-tooling/ember-language-server" = "latest"
"npm:@angular/language-server" = "13.3.2"
"npm:@angular/cli" = "13.3.2"

"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:prettier" = "latest"
"npm:skills" = "latest"
"npm:npm-check-updates" = "latest"

"go:golang.org/x/tools/gopls" = "latest"

"gem:tmuxinator" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age = "1d"

[settings.ruby]
compile = false

[settings.shims]
# Only project configs pin these (claudecode.nvim both, blink-ripgrep.nvim stylua), but mise
# shims every install, active or not, so everywhere else each call paid ~70ms to fall through
# to Homebrew's binary. `mise run`/`mise x` still put a project's pinned install on PATH.
exclude = ["jq", "stylua"]
